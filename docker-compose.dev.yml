# ============================================================
# بيئة التطوير: app + worker + postgres + redis + minio
# التشغيل: docker compose -f docker-compose.dev.yml up -d
# ثم: docker compose -f docker-compose.dev.yml exec app npx prisma migrate deploy
#     docker compose -f docker-compose.dev.yml exec app npm run db:seed
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aldawa
      POSTGRES_PASSWORD: aldawa_dev_pw
      POSTGRES_DB: aldawa
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aldawa"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aldawa
      MINIO_ROOT_PASSWORD: aldawa_dev_minio
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  app:
    build: .
    command: ["sh", "-c", "npx prisma migrate deploy && node server.js"]
    environment:
      NODE_ENV: "development"
      DEMO_MODE: "true"
      DATABASE_URL: postgresql://aldawa:aldawa_dev_pw@postgres:5432/aldawa?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-jwt-secret-0123456789abcdef0123456789abcdef
      LAB_ENC_KEY: dev-enc-key-0123456789abcdef0123456789abcdef
      PUBLIC_BASE_URL: http://localhost:3000
      STORAGE_PROVIDER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: aldawa-files
      S3_ACCESS_KEY_ID: aldawa
      S3_SECRET_ACCESS_KEY: aldawa_dev_minio
      S3_REGION: us-east-1
    ports: ["3000:3000"]
    volumes: [uploads:/app/uploads]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_started }

  worker:
    build: .
    entrypoint: ["node", "node_modules/.bin/tsx"]
    command: ["src/worker/index.ts"]
    environment:
      NODE_ENV: "development"
      DEMO_MODE: "true"
      DATABASE_URL: postgresql://aldawa:aldawa_dev_pw@postgres:5432/aldawa?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-jwt-secret-0123456789abcdef0123456789abcdef
      WORKER_CONCURRENCY: "2"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  miniodata:
  uploads:
