# ============================================================
# ملاحظة: هذا الملف للنشر على VPS فقط (docker-compose) —
# على Railway لا يُستخدم إطلاقًا؛ Railway يبني من Dockerfile ويقرأ railway.toml.
# ============================================================
# الإنتاج: app + worker + postgres + redis + minio + caddy (HTTPS تلقائي)
# المتغيرات من .env — لا أسرار في هذا الملف.
# التشغيل: docker compose -f docker-compose.prod.yml up -d --build
# ثم: npm run init-production (داخل حاوية app)
# ============================================================

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN مطلوب في .env}
    depends_on: [app]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aldawa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD مطلوب}
      POSTGRES_DB: ${POSTGRES_DB:-aldawa}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aldawa}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD مطلوب}"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID مطلوب}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY مطلوب}
    volumes: [miniodata:/data]

  app:
    build: .
    restart: unless-stopped
    command: ["sh", "-c", "npx prisma migrate deploy && node server.js"]
    environment:
      NODE_ENV: production
      DEMO_MODE: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-aldawa}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aldawa}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET مطلوب 32+}
      LAB_ENC_KEY: ${LAB_ENC_KEY:?LAB_ENC_KEY مطلوب}
      TRUSTED_PROXY: "true"
      PUBLIC_BASE_URL: https://${DOMAIN}
      STORAGE_PROVIDER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-aldawa-files}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EXTERNAL_AI_ENABLED: ${EXTERNAL_AI_ENABLED:-false}
      EXTERNAL_AI_API_KEY: ${EXTERNAL_AI_API_KEY:-}
      EXTERNAL_AI_BASE_URL: ${EXTERNAL_AI_BASE_URL:-}
      EXTERNAL_AI_MODEL: ${EXTERNAL_AI_MODEL:-}
      EXTERNAL_AI_VISION_MODEL: ${EXTERNAL_AI_VISION_MODEL:-}
    volumes: [uploads:/app/uploads]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_started }

  worker:
    build: .
    restart: unless-stopped
    entrypoint: ["node", "node_modules/.bin/tsx"]
    command: ["src/worker/index.ts"]
    environment:
      NODE_ENV: production
      DEMO_MODE: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-aldawa}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aldawa}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      LAB_ENC_KEY: ${LAB_ENC_KEY}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      STORAGE_PROVIDER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-aldawa-files}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    volumes: [uploads:/app/uploads]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  miniodata:
  uploads:
  caddydata:
  caddyconfig:
